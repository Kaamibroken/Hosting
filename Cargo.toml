[package]
name = "silent_hosting"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros", "ws"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] } 
tower = { version = "0.4", features = ["util"] }
jsonwebtoken = "9.2"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5.2", features = ["cors", "fs", "trace", "compression-full"] }
futures-util = { version = "0.3", features = ["alloc"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tiktoken-rs = "0.6"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "mysql", "chrono"] }
mongodb = { version = "3.2.0", default-features = true }
redis = { version = "0.27.6", features = ["tokio-comp"] }
base64 = "0.22"
md5 = "0.7"
regex = "1.12.3"
urlencoding = "2.1.3"
once_cell = "1.19.0"
futures = "0.3.32"
zip = "1.1.4"
